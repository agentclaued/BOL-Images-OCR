<script>
// Draw cards 60 at a time as the user scrolls, so large PDFs and result lists stay fast.
function appendCardsInPages(cards,term){
  let drawn=0;const sentinel=document.createElement('div');sentinel.style.cssText='grid-column:1/-1;height:1px';
  const step=()=>{
    const end=Math.min(drawn+60,cards.length),fragment=document.createDocumentFragment();
    for(;drawn<end;drawn++)fragment.append(makeCard(cards[drawn],term));
    sentinel.before(fragment);
    if(drawn>=cards.length){sentinel.remove();return true;}
    return false;
  };
  grid.append(sentinel);
  if(step())return;
  const observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting&&step())observer.disconnect();},{rootMargin:'1500px'});
  observer.observe(sentinel);
}
</script>

<script>
// ---- Search source checkboxes: All / Images-PDF / Excel / CSV ----
(()=>{
  const labels=[['all','All'],['images','Images / PDF'],['excel','Excel (XLS/XLSX)'],['csv','CSV']];
  const wrap=document.createElement('div');wrap.className='source-checks';wrap.setAttribute('role','group');wrap.setAttribute('aria-label','Search in');
  const boxes={};
  for(const [key,text] of labels){
    const label=document.createElement('label');label.className='group-filter';
    const box=document.createElement('input');box.type='checkbox';boxes[key]=box;
    label.append(box,document.createTextNode(' '+text));wrap.append(label);
    box.onchange=()=>changed(key);
  }
  q.parentElement.after(wrap);fileType.hidden=true;  // own row directly under the search box
  function setDefault(){boxes.all.checked=false;boxes.images.checked=true;boxes.excel.checked=false;boxes.csv.checked=false;fileType.value='';}
  function changed(key){
    if(key==='all'&&boxes.all.checked){boxes.images.checked=boxes.excel.checked=boxes.csv.checked=false;}
    else if(key!=='all'&&boxes[key].checked)boxes.all.checked=false;
    if(!boxes.images.checked&&!boxes.excel.checked&&!boxes.csv.checked)boxes.all.checked=true;
    fileType.value='';pdfFilter.value='';selectedPdf=null;render();
  }
  const previousApplyFilters=applyFilters;
  applyFilters=function(cards){
    if(boxes.all.checked)return previousApplyFilters(cards);
    return previousApplyFilters(cards.filter(card=>card.file_id
      ?(card.file_type==='csv'?boxes.csv.checked:boxes.excel.checked)
      :boxes.images.checked));
  };
  setDefault();
  document.querySelector('[data-tab="main"]').addEventListener('click',()=>{setDefault();render();});
  if(!data.length)count.textContent='Loading gallery…';
})();

// ---- Stuck / failed files: reprocess or delete ----
(()=>{
  const panel=document.querySelector('#processorPanel'),anchor=document.querySelector('#jobStatus');
  const section=document.createElement('section');section.className='stuck-section';section.hidden=true;
  const head=document.createElement('div');head.className='stuck-head';
  const title=document.createElement('strong');title.textContent='Stuck or failed files';
  const bulk=document.createElement('span');bulk.className='stuck-bulk';
  const reAll=document.createElement('button');reAll.type='button';reAll.textContent='Reprocess all';
  const delAll=document.createElement('button');delAll.type='button';delAll.textContent='Delete all';delAll.className='stuck-del';
  bulk.append(reAll,delAll);head.append(title,bulk);
  const list=document.createElement('div');list.className='stuck-list';
  section.append(head,list);anchor.before(section);
  let busy=false;
  async function call(url,confirmText){
    if(busy)return;if(confirmText&&!confirm(confirmText))return;
    busy=true;section.querySelectorAll('button').forEach(b=>b.disabled=true);
    try{const r=await fetch(url,{method:'POST'});if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.detail||'That action failed.');}}
    catch(error){alert('The app could not be reached. Try again.');}
    finally{busy=false;refresh();}
  }
  reAll.onclick=()=>call('/api/process/stuck/reprocess');
  delAll.onclick=()=>call('/api/process/stuck/delete','Delete every stuck or failed file from the queue?\n\nUnfinished partial output is removed. Uploaded PDFs and finished gallery pages are kept.');
  function render(items){
    section.hidden=!items.length;list.replaceChildren();
    for(const item of items){
      const row=document.createElement('div');row.className='stuck-row';
      const text=document.createElement('div');
      const name=document.createElement('div');name.className='stuck-name';name.textContent=item.name;
      const why=document.createElement('div');why.className='stuck-why';
      why.textContent=item.reason+(item.page_total?' · page '+item.page_current+' of '+item.page_total:'');
      text.append(name,why);
      const actions=document.createElement('div');actions.className='stuck-actions';
      const re=document.createElement('button');re.type='button';re.textContent='Reprocess';
      re.onclick=()=>call('/api/process/job/reprocess?job_id='+encodeURIComponent(item.id));
      const del=document.createElement('button');del.type='button';del.textContent='Delete';del.className='stuck-del';
      del.onclick=()=>call('/api/process/job/delete?job_id='+encodeURIComponent(item.id),'Delete '+item.name+' from the queue?\n\nUnfinished partial output is removed. The uploaded PDF and finished gallery pages are kept.');
      actions.append(re,del);row.append(text,actions);list.append(row);
    }
  }
  async function refresh(){
    try{const r=await fetch('/api/process/status',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(r.ok)render((await r.json()).stuck_jobs||[]);}catch(error){}
  }
  refresh();setInterval(refresh,4000);
})();

// ---- Large PDF selections: small parallel chunks instead of one huge request ----
processUpload=async function(){
  const slots=selectedSlots();if(slots===null)return;
  const files=[...document.querySelector('#pdfUpload').files].filter(file=>file.name.toLowerCase().endsWith('.pdf'));
  if(!files.length)return alert('Choose one or more PDF files first.');
  const button=document.querySelector('#pdfSource button');button.disabled=true;
  const session=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
  const chunks=[];let current=[],bytes=0;
  for(const file of files){
    if(current.length>=10||(current.length&&bytes+file.size>80*1024*1024)){chunks.push(current);current=[];bytes=0;}
    current.push(file);bytes+=file.size;
  }
  if(current.length)chunks.push(current);
  let sent=0,accepted=0;const duplicates=[],failures=[];
  const show=()=>{jobStatus.textContent='UPLOADING: '+sent+' of '+files.length+' PDFs sent';};
  async function sendChunk(chunk){
    for(let attempt=0;attempt<3;attempt++){
      try{
        const form=new FormData();for(const file of chunk)form.append('files',file,file.name);
        const response=await fetch('/api/process/stage?session='+session,{method:'POST',body:form});
        if(!response.ok)throw Error(((await response.json().catch(()=>({}))).detail)||('HTTP '+response.status));
        const body=await response.json();accepted+=body.accepted;duplicates.push(...body.duplicates);
        sent+=chunk.length;show();return;
      }catch(error){
        if(attempt===2){failures.push(...chunk.map(file=>file.name+': '+error.message));sent+=chunk.length;show();}
        else await new Promise(resolve=>setTimeout(resolve,1000*(attempt+1)));
      }
    }
  }
  try{
    show();let next=0;
    await Promise.all(Array.from({length:Math.min(3,chunks.length)},async()=>{while(next<chunks.length)await sendChunk(chunks[next++]);}));
    let notes=[];
    if(duplicates.length)notes.push('Duplicate PDF not uploaded:\n'+duplicates.map(item=>item.uploaded+' is already uploaded as '+item.existing.join(', ')).join('\n'));
    if(failures.length)notes.push('Could not upload:\n'+failures.join('\n'));
    if(!accepted){alert(notes.join('\n\n')||'No new PDFs were uploaded.');return;}
    const response=await fetch('/api/process/stage/start?session='+session+'&slots='+slots,{method:'POST',headers:slotHeaders()});
    if(!response.ok){alert(((await response.json().catch(()=>({}))).detail)||'Could not start processing.');return;}
    if(notes.length)alert(accepted+' PDF(s) started.\n\n'+notes.join('\n\n'));
    showJob();
  }finally{button.disabled=false;}
};
</script>

<script>
// ---- Text results view: one line per match, like compiler output ----
(()=>{
  let textMode=true,showContext=true,wrapLines=true;
  try{textMode=localStorage.getItem('bol-text-results')!=='0';}catch(error){}
  const SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="15" height="15" rx="2"/><circle cx="7" cy="8" r="1.3"/><path d="m17 13-4-4L4 18"/><path d="M19 12v9m-3-3 3 3 3-3"/></svg>';
  const toggle=document.createElement('label');toggle.className='group-filter';
  const toggleBox=document.createElement('input');toggleBox.type='checkbox';toggleBox.checked=textMode;
  toggle.append(toggleBox,document.createTextNode(' Text results'));
  document.querySelector('#loadImages').parentElement.after(toggle);
  toggleBox.onchange=()=>{textMode=toggleBox.checked;try{localStorage.setItem('bol-text-results',textMode?'1':'0');}catch(error){}render();};

  function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
  function downloadLink(href,name,title){
    const link=el('a','term-dl');link.href=href;link.download=name;link.title=title;link.setAttribute('aria-label',title);
    link.innerHTML=SVG;link.onclick=event=>event.stopPropagation();return link;
  }
  function hitRow(location,line,term,matched,open,download){
    const row=el('div','term-hit'+(matched?'':' term-ctx'));row.tabIndex=0;row.setAttribute('role','button');
    const loc=el('span','term-loc');loc.append(document.createTextNode(location[0]),el('b',null,':'),document.createTextNode(location[1]),el('b',null,':'));
    const text=el('span','term-txt');if(matched)addText(text,line,term);else text.textContent=line;
    row.append(loc,text);if(download)row.append(download);
    row.onclick=open;row.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}};
    return row;
  }
  function pageRows(card,term){
    const needle=term.toLowerCase(),lines=String(card.text||'').split(/\r?\n/),rows=[];
    const hits=[];lines.forEach((line,index)=>{if(line.toLowerCase().includes(needle))hits.push(index);});
    if(!hits.length)return [{index:null,line:card.name,matched:true,detail:true}];
    const keep=new Map();
    for(const index of hits){
      keep.set(index,true);
      if(showContext)for(const near of [index-1,index+1])if(near>=0&&near<lines.length&&lines[near].trim()&&!keep.has(near))keep.set(near,false);
    }
    let previous=null;
    for(const index of [...keep.keys()].sort((a,b)=>a-b)){
      if(previous!==null&&index-previous>1)rows.push({gap:true});
      rows.push({index,line:lines[index],matched:keep.get(index)});previous=index;
    }
    return rows;
  }
  function matchCount(rows){return rows.filter(row=>row.matched&&!row.gap).length;}

  function renderTextResults(term){
    const cards=applyFilters(data);
    const pages=cards.filter(card=>!card.file_id&&!card.processing&&card.image)
      .sort((a,b)=>String(a.pdf).localeCompare(String(b.pdf))||Number(a.page)-Number(b.page));
    const sheets=cards.filter(card=>card.file_id);
    const groups=new Map();let matches=0;
    for(const card of pages){
      const rows=pageRows(card,term);matches+=matchCount(rows);
      if(!groups.has(card.pdf))groups.set(card.pdf,[]);groups.get(card.pdf).push({card,rows});
    }
    matches+=sheets.length;
    grid.replaceChildren();
    count.textContent=matches+' match'+(matches===1?'':'es')+' in '+(groups.size+sheets.length)+' file'+(groups.size+sheets.length===1?'':'s');

    const toolbar=el('div','text-toolbar');
    for(const [label,get,set] of [['Show context lines',()=>showContext,v=>showContext=v],['Wrap long lines',()=>wrapLines,v=>wrapLines=v]]){
      const wrapper=el('label'),box=document.createElement('input');box.type='checkbox';box.checked=get();
      box.onchange=()=>{set(box.checked);render();};wrapper.append(box,document.createTextNode(label));toolbar.append(wrapper);
    }
    const box=el('div','term'+(wrapLines?'':' term-nowrap'));box.setAttribute('role','list');
    grid.append(toolbar,box);
    if(!groups.size&&!sheets.length){box.append(el('div','term-empty','No matches for “'+term+'”.'));return;}

    // Draw page groups in batches so thousands of matches stay responsive.
    const work=[...groups.entries()];let nextGroup=0;
    const sentinel=el('div');sentinel.style.height='1px';
    function drawBatch(){
      let rowBudget=300;
      while(nextGroup<work.length&&rowBudget>0){
        const [pdf,entries]=work[nextGroup++];
        const total=entries.reduce((sum,entry)=>sum+matchCount(entry.rows),0);
        const head=el('div','term-file');head.setAttribute('role','listitem');
        head.append(document.createTextNode(pdf),el('small',null,total+' match'+(total===1?'':'es')));
        sentinel.before(head);
        for(const {card,rows} of entries){
          let gapBefore=false;
          for(const row of rows){
            if(row.gap){gapBefore=true;continue;}
            if(gapBefore){sentinel.before(el('div','term-gap','··'));gapBefore=false;}
            const download=row.matched?downloadLink('/api/download?file='+encodeURIComponent(card.image),card.name,'Download image '+card.name):null;
            sentinel.before(hitRow(['p'+card.page,row.index===null?'–':String(row.index+1)],row.line,term,row.matched,()=>openProductView(card),download));
            rowBudget--;
          }
        }
      }
      if(nextGroup>=work.length){
        sentinel.remove();
        if(sheets.length)box.append(...sheetSection(sheets,term));
        box.append(el('div','term-end',matches+' match'+(matches===1?'':'es')+' in '+(groups.size+sheets.length)+' file'+(groups.size+sheets.length===1?'':'s')));
        return true;
      }
      return false;
    }
    box.append(sentinel);
    if(!drawBatch()){
      const observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting&&drawBatch())observer.disconnect();},{rootMargin:'1200px'});
      observer.observe(sentinel);
    }
  }
  function sheetSection(sheets,term){
    const nodes=[];const head=el('div','term-file');
    head.append(document.createTextNode('Spreadsheets'),el('small',null,sheets.length+' file'+(sheets.length===1?'':'s')));nodes.push(head);
    for(const card of sheets){
      const line=card.name+' — '+card.sheet_count+' sheet'+(card.sheet_count===1?'':'s')+(card.match_preview?' · '+card.match_preview:'');
      nodes.push(hitRow([card.file_type,'–'],line,term,true,()=>openSpreadsheet(card),downloadLink(spreadsheetDownload(card.file_id),card.name,'Download '+card.name)));
    }
    return nodes;
  }

  const baseRender=render;
  render=function(){
    const term=q.value.trim();
    if(textMode&&term&&tab!=='trash'&&!selectedPdf&&!pdfViewSelected&&!dateViewSelected){renderTextResults(term);return;}
    baseRender();
  };
  render();
})();
</script>

<script>
// Put source chips, file filter and view controls in one tidy toolbar row under the search box.
(()=>{
  const header=document.querySelector('body>header'),row=document.createElement('div');row.className='toolbar-row';
  const parts=[document.querySelector('.source-checks'),document.querySelector('#pdfFilter')?.closest('.filter-slot'),document.querySelector('header .tabs')].filter(Boolean);
  for(const part of parts)row.append(part);
  header.append(row);
})();
</script>
